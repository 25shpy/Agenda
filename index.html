<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Agenda</title>
  <style>
    :root {
      --bg: #f5f1ea;
      --paper: #fffdf9;
      --text: #1f1f1f;
      --muted: #777;
      --line: #e7e0d7;
      --accent: #111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .app {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--paper);
      padding: calc(18px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));
    }
    .top {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: white;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 16px;
    }
    .datebox {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 10px;
      background: white;
    }
    input[type="date"] {
      width: 100%;
      border: 0;
      background: transparent;
      font-size: 17px;
      outline: none;
      color: var(--text);
    }
    h1 {
      font-size: 28px;
      margin: 6px 0 2px;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 16px;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      min-height: 62vh;
      resize: none;
      border: 0;
      outline: none;
      padding: 6px 2px;
      font-size: 19px;
      line-height: 1.72;
      color: var(--text);
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 31px,
          var(--line) 32px
        );
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <button id="prev" aria-label="Önceki gün">‹</button>
      <div class="datebox">
        <input id="date" type="date">
      </div>
      <button id="next" aria-label="Sonraki gün">›</button>
    </div>

    <h1 id="title"></h1>
    <div class="subtitle">Bu günün notları otomatik kaydedilir.</div>

    <textarea id="note" placeholder="Yazmaya başla..."></textarea>
    <div class="status" id="status">Hazır</div>
  </main>

  <script>
    const dateInput = document.getElementById('date');
    const note = document.getElementById('note');
    const title = document.getElementById('title');
    const status = document.getElementById('status');

    const pad = n => String(n).padStart(2, '0');
    const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

    function prettyDate(iso) {
      const [y,m,d] = iso.split('-').map(Number);
      const dt = new Date(y, m-1, d);
      return new Intl.DateTimeFormat('tr-TR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }).format(dt);
    }

    function keyFor(iso) {
      return `agenda-note:${iso}`;
    }

    function loadDate(iso) {
      dateInput.value = iso;
      title.textContent = prettyDate(iso);
      note.value = localStorage.getItem(keyFor(iso)) || '';
      status.textContent = 'Hazır';
    }

    let saveTimer;
    note.addEventListener('input', () => {
      status.textContent = 'Kaydediliyor…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        localStorage.setItem(keyFor(dateInput.value), note.value);
        status.textContent = 'Kaydedildi';
      }, 250);
    });

    dateInput.addEventListener('change', () => loadDate(dateInput.value));

    function shiftDay(delta) {
      const [y,m,d] = dateInput.value.split('-').map(Number);
      const dt = new Date(y, m-1, d);
      dt.setDate(dt.getDate() + delta);
      loadDate(toISO(dt));
    }

    document.getElementById('prev').addEventListener('click', () => shiftDay(-1));
    document.getElementById('next').addEventListener('click', () => shiftDay(1));

    const today = new Date();
    loadDate(toISO(today));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
